<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EduGenie — your AI-powered learning assistant">
  <title>EduGenie | Learning Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="brand-mark" aria-hidden="true">✦</div>
      <p class="eyebrow">YOUR PERSONAL AI STUDY COMPANION</p>
      <h1>Learn smarter with <span>EduGenie</span></h1>
      <p class="subtitle">Ask questions, simplify concepts, test your knowledge, and plan what to learn next.</p>
    </header>

    <section class="workspace" aria-label="Learning assistant">
      <form id="study-form">
        <label for="task">What would you like to do?</label>
        <div class="task-grid" role="group" aria-label="Choose a task">
          <button type="button" class="task active" data-task="qa"><span>💬</span><b>Ask</b><small>Get an answer</small></button>
          <button type="button" class="task" data-task="explain"><span>💡</span><b>Explain</b><small>Simplify a concept</small></button>
          <button type="button" class="task" data-task="quiz"><span>📝</span><b>Quiz</b><small>Test your knowledge</small></button>
          <button type="button" class="task" data-task="summarize"><span>📚</span><b>Summarize</b><small>Revise key points</small></button>
          <button type="button" class="task" data-task="learn"><span>🧭</span><b>Learning path</b><small>Plan your learning</small></button>
        </div>
        <label for="prompt" id="input-label">Your question</label>
        <textarea id="prompt" rows="5" maxlength="30000" placeholder="e.g. Which is the largest ocean?" required></textarea>
        <div class="form-bottom">
          <span id="char-count">0 / 30000</span>
          <button class="submit" id="submit" type="submit"><span>Generate</span><span aria-hidden="true">↗</span></button>
        </div>
      </form>
      <section id="result-card" class="result-card" aria-live="polite" hidden>
        <div class="result-heading"><h2 id="result-title">Your result</h2><button id="clear" class="clear" type="button">Clear</button></div>
        <div id="result" class="result"></div>
      </section>
    </section>
    <footer>Made for curious minds <span>✦</span> Verify important facts with trusted sources.</footer>
  </main>
  <script>
    const form = document.querySelector("#study-form");
    const promptInput = document.querySelector("#prompt");
    const count = document.querySelector("#char-count");
    const submit = document.querySelector("#submit");
    const resultCard = document.querySelector("#result-card");
    const result = document.querySelector("#result");
    const labels = {
      qa: ["Your question", "e.g. Which is the largest ocean?", "Answer"],
      explain: ["Topic to explain", "e.g. Photosynthesis", "Simple explanation"],
      quiz: ["Topic or passage", "Paste a passage or enter a topic…", "Your quiz"],
      summarize: ["Text to summarize", "Paste your educational text here…", "Summary"],
      learn: ["What do you want to learn?", "e.g. SQL, Python, or machine learning", "Your learning path"]
    };
    let selectedTask = "qa";

    document.querySelectorAll(".task").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".task").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        selectedTask = button.dataset.task;
        document.querySelector("#input-label").textContent = labels[selectedTask][0];
        promptInput.placeholder = labels[selectedTask][1];
      });
    });
    promptInput.addEventListener("input", () => count.textContent = `${promptInput.value.length} / 30000`);
    document.querySelector("#clear").addEventListener("click", () => {
      resultCard.hidden = true;
      result.replaceChildren();
      promptInput.focus();
    });

    function renderText(value) {
      const p = document.createElement("p");
      p.textContent = value;
      result.appendChild(p);
    }
    function renderQuiz(questions) {
      questions.forEach((q, index) => {
        const card = document.createElement("article");
        card.className = "question";
        const heading = document.createElement("h3");
        heading.textContent = `${index + 1}. ${q.question}`;
        card.appendChild(heading);
        const choices = document.createElement("div");
        choices.className = "choices";
        q.options.forEach(option => {
          const label = document.createElement("label");
          label.className = "choice";
          const radio = document.createElement("input");
          radio.type = "radio";
          radio.name = `question-${index}`;
          radio.value = option;
          label.append(radio, document.createTextNode(option));
          choices.appendChild(label);
        });
        card.appendChild(choices);
        const check = document.createElement("button");
        check.type = "button";
        check.className = "check-answer";
        check.textContent = "Check answer";
        const feedback = document.createElement("p");
        feedback.className = "feedback";
        feedback.hidden = true;
        check.addEventListener("click", () => {
          const chosen = card.querySelector("input:checked");
          if (!chosen) {
            feedback.textContent = "Choose an option first.";
            feedback.className = "feedback neutral";
          } else if (chosen.value === q.answer) {
            feedback.textContent = `Correct! ${q.explanation || ""}`;
            feedback.className = "feedback correct";
          } else {
            feedback.textContent = `Not quite. Correct answer: ${q.answer}. ${q.explanation || ""}`;
            feedback.className = "feedback incorrect";
          }
          feedback.hidden = false;
        });
        card.append(check, feedback);
        result.appendChild(card);
      });
    }
    form.addEventListener("submit", async event => {
      event.preventDefault();
      const text = promptInput.value.trim();
      if (!text) { promptInput.focus(); return; }
      const endpoint = selectedTask === "learn" ? "/learn/recommendations" : `/${selectedTask}`;
      submit.disabled = true;
      submit.querySelector("span").textContent = "Working…";
      resultCard.hidden = false;
      result.replaceChildren();
      document.querySelector("#result-title").textContent = labels[selectedTask][2];
      renderText("EduGenie is preparing your response…");
      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({task: selectedTask, text})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "Request failed.");
        result.replaceChildren();
        if (selectedTask === "quiz") renderQuiz(data.result);
        else renderText(typeof data.result === "string" ? data.result : JSON.stringify(data.result, null, 2));
      } catch (error) {
        result.replaceChildren();
        const p = document.createElement("p");
        p.className = "error";
        p.textContent = error.message || "Something went wrong. Please try again.";
        result.appendChild(p);
      } finally {
        submit.disabled = false;
        submit.querySelector("span").textContent = "Generate";
      }
    });
  </script>
</body>
</html>
